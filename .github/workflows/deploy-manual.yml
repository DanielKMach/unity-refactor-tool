name: Deploy Manual 

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Manual Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r manual/requirements.txt
      - name: Build Manual
        run: |
          python manual/manual.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Manual
        run: |
          mkdir -p public
          cp MANUAL.html public/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
